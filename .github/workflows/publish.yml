name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    if: startsWith(github.event.release.tag_name, 'eslint-config-yarapa-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e "import fs from 'node:fs'; const pkg = JSON.parse(fs.readFileSync('packages/eslint-config-yarapa/package.json', 'utf8')); process.stdout.write(pkg.version);")"
          test "$RELEASE_TAG" = "eslint-config-yarapa-v${version}"
          npm --version

      - name: Rebuild and verify release candidate
        run: pnpm --filter eslint-config-yarapa verify

      - name: Publish with npm Trusted Publishing
        working-directory: packages/eslint-config-yarapa
        run: npm publish --access public
