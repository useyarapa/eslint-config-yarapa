name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lockfile-sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/enterprise-hardening'
    name: lockfile-sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@a22f73f7b82b3d319192abe925c134537551f326 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/setup@0de73ac5e261407036c76d677993d2ac120e5325 # v2
        with:
          runtime: node@24.15.0
          install: false
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): sync tooling lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a22f73f7b82b3d319192abe925c134537551f326 # v7
      - uses: pnpm/setup@0de73ac5e261407036c76d677993d2ac120e5325 # v2
        with:
          runtime: node@24.15.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa build
      - run: pnpm --filter eslint-config-yarapa lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a22f73f7b82b3d319192abe925c134537551f326 # v7
      - uses: pnpm/setup@0de73ac5e261407036c76d677993d2ac120e5325 # v2
        with:
          runtime: node@24.15.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa test

  check-types:
    name: check-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a22f73f7b82b3d319192abe925c134537551f326 # v7
      - uses: pnpm/setup@0de73ac5e261407036c76d677993d2ac120e5325 # v2
        with:
          runtime: node@24.15.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa check-types

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a22f73f7b82b3d319192abe925c134537551f326 # v7
      - uses: pnpm/setup@0de73ac5e261407036c76d677993d2ac120e5325 # v2
        with:
          runtime: node@24.15.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa build

  inventory:
    name: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a22f73f7b82b3d319192abe925c134537551f326 # v7
      - uses: pnpm/setup@0de73ac5e261407036c76d677993d2ac120e5325 # v2
        with:
          runtime: node@24.15.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa inventory:check

  consumer:
    name: consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a22f73f7b82b3d319192abe925c134537551f326 # v7
      - uses: pnpm/setup@0de73ac5e261407036c76d677993d2ac120e5325 # v2
        with:
          runtime: node@24.20.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa test:consumer

  compatibility:
    name: compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: node-24.15.0-eslint-10.0.0-typescript-5.0.4
            node: 24.15.0
            eslint: 10.0.0
            typescript: 5.0.4
          - name: node-24.20.0-eslint-10.9.1-typescript-5.9.3
            node: 24.20.0
            eslint: 10.9.1
            typescript: 5.9.3
          - name: node-24.20.0-eslint-10.9.1-typescript-6.0.3
            node: 24.20.0
            eslint: 10.9.1
            typescript: 6.0.3
    env:
      ESLINT_VERSION: ${{ matrix.eslint }}
      TYPESCRIPT_VERSION: ${{ matrix.typescript }}
    steps:
      - uses: actions/checkout@a22f73f7b82b3d319192abe925c134537551f326 # v7
      - uses: pnpm/setup@0de73ac5e261407036c76d677993d2ac120e5325 # v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
      - run: pnpm --filter eslint-config-yarapa test:consumer

  windows-consumer:
    name: windows-consumer
    runs-on: windows-latest
    env:
      ESLINT_VERSION: 10.9.1
      TYPESCRIPT_VERSION: 6.0.3
    steps:
      - uses: actions/checkout@a22f73f7b82b3d319192abe925c134537551f326 # v7
      - uses: pnpm/setup@0de73ac5e261407036c76d677993d2ac120e5325 # v2
        with:
          runtime: node@24.20.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa test:consumer
