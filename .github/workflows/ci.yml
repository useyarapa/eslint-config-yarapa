name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl --fail --location --silent --show-error --output "$archive" "$url"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
      - name: Lint GitHub Actions workflows
        run: ./actionlint -color -pyflakes=

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: true
      - name: Lint repository
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: true
      - name: Run tests
        run: pnpm test

  benchmark:
    name: Performance & Memory Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: true
      - name: Run benchmark suite
        run: pnpm --filter eslint-config-yarapa test test/benchmark.test.ts

  check-types:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: true
      - name: Check types
        run: pnpm check-types

  knip:
    name: Dead Code & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: true
      - name: Run Knip audit
        run: pnpm knip

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: true
      - name: Build package
        run: pnpm build
      - name: Validate package metadata
        run: pnpm --filter eslint-config-yarapa check:publint
      - name: Validate type declarations
        run: pnpm --filter eslint-config-yarapa check:attw

  consumer:
    name: Consumer Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
      - name: Run consumer verification
        run: pnpm --filter eslint-config-yarapa test:consumer

  compatibility:
    name: Compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: node-24.15.0-eslint-10.0.0-typescript-5.0.4
            node: 24.15.0
            eslint: 10.0.0
            typescript: 5.0.4
          - name: node-24.20.0-eslint-10.9.1-typescript-5.9.3
            node: 24.20.0
            eslint: 10.9.1
            typescript: 5.9.3
          - name: node-24.20.0-eslint-10.9.1-typescript-6.0.3
            node: 24.20.0
            eslint: 10.9.1
            typescript: 6.0.3
    env:
      ESLINT_VERSION: ${{ matrix.eslint }}
      TYPESCRIPT_VERSION: ${{ matrix.typescript }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@${{ matrix.node }}
          cache: true
      - name: Run consumer verification
        run: pnpm --filter eslint-config-yarapa test:consumer

  windows-consumer:
    name: Windows Consumer Test
    runs-on: windows-latest
    env:
      ESLINT_VERSION: 10.9.1
      TYPESCRIPT_VERSION: 6.0.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
      - name: Run consumer verification
        run: pnpm --filter eslint-config-yarapa test:consumer

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks CLI
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$archive" \
            "$release/$archive"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/gitleaks-checksums.txt" \
            "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  $archive$" "$RUNNER_TEMP/gitleaks-checksums.txt" \
            > "$RUNNER_TEMP/gitleaks-archive.sha256"
          grep --quiet "^${GITLEAKS_SHA256}  ${archive}$" \
            "$RUNNER_TEMP/gitleaks-archive.sha256"
          (
            cd "$RUNNER_TEMP"
            sha256sum --check gitleaks-archive.sha256
          )
          tar --extract --gzip \
            --file "$RUNNER_TEMP/$archive" \
            --directory "$RUNNER_TEMP/gitleaks" \
            gitleaks
      - name: Scan pull request commits for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose \
            --log-opts="$BASE_SHA..$HEAD_SHA" .
      - name: Scan pushed commits for secrets
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [ "$BASE_SHA" = "$zero_sha" ]; then
            "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose \
              --log-opts="$HEAD_SHA" .
          else
            "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose \
              --log-opts="$BASE_SHA..$HEAD_SHA" .
          fi

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Recognize Changesets version PR
        if: >-
          github.head_ref == format('changeset-release/{0}', github.base_ref) &&
          github.event.pull_request.user.login == 'github-actions[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: echo "Changesets version PR already contains consumed release intent."
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: >-
          github.head_ref != format('changeset-release/{0}', github.base_ref) ||
          github.event.pull_request.user.login != 'github-actions[bot]' ||
          github.event.pull_request.head.repo.full_name != github.repository
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        if: >-
          github.head_ref != format('changeset-release/{0}', github.base_ref) ||
          github.event.pull_request.user.login != 'github-actions[bot]' ||
          github.event.pull_request.head.repo.full_name != github.repository
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true
      - name: Require release intent for changed packages
        if: >-
          github.head_ref != format('changeset-release/{0}', github.base_ref) ||
          github.event.pull_request.user.login != 'github-actions[bot]' ||
          github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec changeset status --since "$BASE_SHA"

  ci:
    name: CI
    if: always()
    needs:
      - actionlint
      - lint
      - test
      - check-types
      - build
      - consumer
      - compatibility
      - windows-consumer
      - dependency-review
      - gitleaks
      - changesets
      - benchmark
      - knip
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        env:
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CHANGESETS_RESULT: ${{ needs.changesets.result }}
          CHECK_TYPES_RESULT: ${{ needs.check-types.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          KNIP_RESULT: ${{ needs.knip.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_CONSUMER_RESULT: ${{ needs.windows-consumer.result }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
            test "$CHANGESETS_RESULT" = success
          else
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
            test "$CHANGESETS_RESULT" = skipped
          fi

          for result in \
            "$ACTIONLINT_RESULT" \
            "$BENCHMARK_RESULT" \
            "$BUILD_RESULT" \
            "$CHECK_TYPES_RESULT" \
            "$COMPATIBILITY_RESULT" \
            "$CONSUMER_RESULT" \
            "$GITLEAKS_RESULT" \
            "$KNIP_RESULT" \
            "$LINT_RESULT" \
            "$TEST_RESULT" \
            "$WINDOWS_CONSUMER_RESULT"
          do
            test "$result" = success
          done
