name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync-lockfile:
    name: sync-lockfile
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 37 && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: false
          install: false
      - name: Generate lockfile from manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): sync pnpm lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa build
      - run: pnpm --filter eslint-config-yarapa lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa test

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa test:mutation

  check-types:
    name: check-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa check-types

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa build

  consumer:
    name: consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa test:consumer

  compatibility:
    name: compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: node-24.15.0-eslint-10.0.0-typescript-5.0.4
            node: 24.15.0
            eslint: 10.0.0
            typescript: 5.0.4
          - name: node-24.20.0-eslint-10.9.1-typescript-5.9.3
            node: 24.20.0
            eslint: 10.9.1
            typescript: 5.9.3
          - name: node-24.20.0-eslint-10.9.1-typescript-6.0.3
            node: 24.20.0
            eslint: 10.9.1
            typescript: 6.0.3
    env:
      ESLINT_VERSION: ${{ matrix.eslint }}
      TYPESCRIPT_VERSION: ${{ matrix.typescript }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@${{ matrix.node }}
          cache: true
      - run: pnpm --filter eslint-config-yarapa test:consumer

  windows-consumer:
    name: windows-consumer
    runs-on: windows-latest
    env:
      ESLINT_VERSION: 10.9.1
      TYPESCRIPT_VERSION: 6.0.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
      - run: pnpm --filter eslint-config-yarapa test:consumer

  diagnostic-snapshot:
    name: diagnostic-snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.15.0
          cache: true
      - name: Build final dependency snapshot
        working-directory: packages/eslint-config-yarapa
        run: |
          pnpm remove \
            @vitest/eslint-plugin \
            eslint-plugin-ava \
            eslint-plugin-testing-library
          pnpm add --save-exact \
            @next/eslint-plugin-next@16.3.4 \
            eslint-plugin-react-hooks@7.1.1
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import nextPlugin from "@next/eslint-plugin-next";
          import reactHooks from "eslint-plugin-react-hooks";
          import sonarjs from "eslint-plugin-sonarjs";

          const snapshot = {
            nextRules: nextPlugin.configs.recommended.rules,
            reactHooksRules: reactHooks.configs.flat.recommended.rules,
            sonarRules: Object.keys(sonarjs.rules)
              .filter(ruleName => ruleName !== "file-header")
              .sort(),
          };
          writeFileSync(
            "../../dependency-snapshot.json",
            `${JSON.stringify(snapshot, null, 2)}\n`,
          );
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-snapshot
          path: |
            pnpm-lock.yaml
            dependency-snapshot.json
          if-no-files-found: error
          retention-days: 1

  inventory:
    name: inventory
    if: always()
    needs:
      - mutation
      - diagnostic-snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Require mutation and diagnostic snapshot
        env:
          DIAGNOSTIC_RESULT: ${{ needs.diagnostic-snapshot.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
        run: |
          test "$MUTATION_RESULT" = success
          test "$DIAGNOSTIC_RESULT" = success

  ci:
    name: ci
    if: always()
    needs:
      - lint
      - test
      - inventory
      - check-types
      - build
      - consumer
      - compatibility
      - windows-consumer
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECK_TYPES_RESULT: ${{ needs.check-types.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_CONSUMER_RESULT: ${{ needs.windows-consumer.result }}
        run: |
          for result in \
            "$BUILD_RESULT" \
            "$CHECK_TYPES_RESULT" \
            "$COMPATIBILITY_RESULT" \
            "$CONSUMER_RESULT" \
            "$INVENTORY_RESULT" \
            "$LINT_RESULT" \
            "$TEST_RESULT" \
            "$WINDOWS_CONSUMER_RESULT"
          do
            test "$result" = success
          done
