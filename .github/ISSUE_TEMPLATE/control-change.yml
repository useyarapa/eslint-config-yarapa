name: Lint control change
description: Propose a rule, preset, severity, option, scope, dependency, or compatibility-boundary change.
title: "control: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Lint behavior is a compatibility surface. New errors, tighter options, and broader applicability can be breaking even when the JavaScript API is unchanged.
  - type: dropdown
    id: change_type
    attributes:
      label: Change type
      options:
        - Enable a new diagnostic
        - Tighten an existing diagnostic
        - Relax or disable a diagnostic
        - Change autofix behavior
        - Change preset/file scope
        - Change supported Node.js/ESLint/TypeScript range
        - Upgrade a lint-runtime dependency
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Control rationale
      description: Explain the defect/risk addressed and why the change belongs in a high-assurance shared baseline.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and expected diagnostics
      description: Identify valid/invalid fixtures, expected rule IDs, false-positive considerations, and compatibility evidence.
    validations:
      required: true
  - type: textarea
    id: semver
    attributes:
      label: Behavioral SemVer impact
      description: State whether this can introduce new diagnostics or source changes for existing consumers.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Required review
      options:
        - label: Rule Inventory impact has been considered.
          required: true
        - label: Autofix safety/idempotence has been considered where applicable.
          required: true
        - label: No CI/security control is being weakened merely to reduce friction.
          required: true
